<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>長照補助基準查詢系統</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    
    /* 處理手機版抽屜滑出動畫 */
    @media (max-width: 767px) {
      .sidebar-drawer {
        position: fixed;
        top: 56px;
        left: 0;
        bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.3s ease-in-out;
        width: 85% !important;
        max-width: 340px;
      }
      .sidebar-drawer.open {
        transform: translateX(0);
      }
      .drawer-overlay {
        position: fixed;
        top: 56px; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.4);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease-in-out;
      }
      .drawer-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }
    }
  </style>
</head>
<body class="bg-gray-50 font-sans h-screen flex flex-col overflow-hidden select-none">

  <header class="bg-blue-600 text-white h-[56px] px-4 shadow-md flex justify-between items-center shrink-0 z-50">
    <div class="flex items-center space-x-2">
      <button id="menu-toggle" class="md:hidden p-1.5 hover:bg-blue-700 rounded-lg transition mr-1" aria-label="開啟選單">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <h1 class="text-base md:text-lg font-bold tracking-wider truncate max-w-[160px] sm:max-w-none">長照補助查詢系統</h1>
      <span class="bg-blue-800 text-[10px] md:text-xs px-2 py-0.5 rounded-full font-medium shrink-0">2026年7月新制</span>
    </div>
    <button id="sync-btn" class="bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white text-xs md:text-sm font-medium px-2.5 py-1.5 md:px-3 rounded shadow flex items-center transition shrink-0">
      <span id="sync-icon" class="mr-1">🔄</span> 同步資料
    </button>
  </header>

  <div id="drawer-overlay" class="drawer-overlay"></div>

  <main class="flex-1 flex overflow-hidden relative">
    
    <section id="sidebar" class="sidebar-drawer w-1/3 min-w-[300px] max-w-[400px] border-r border-gray-200 bg-white flex flex-col h-full shrink-0 shadow-lg md:shadow-none">
      
      <div class="p-3 border-b border-gray-100 space-y-2.5 bg-gray-50/50">
        <div class="relative">
          <input type="text" id="search-input" placeholder="輸入碼別或項目關鍵字..." 
                 class="w-full pl-3 pr-8 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
          <button id="clear-search" class="absolute right-2.5 top-2.5 text-gray-400 hover:text-gray-600 hidden text-sm">✕</button>
        </div>
        
        <div class="flex p-0.5 bg-gray-200 rounded-lg text-xs md:text-sm">
          <button class="tab-btn flex-1 py-1.5 text-center font-bold rounded-md transition bg-white text-blue-600 shadow-sm" data-type="ALL">全部</button>
          <button class="tab-btn flex-1 py-1.5 text-center font-bold rounded-md transition text-gray-600 hover:text-gray-900" data-type="E">E碼</button>
          <button class="tab-btn flex-1 py-1.5 text-center font-bold rounded-md transition text-gray-600 hover:text-gray-900" data-type="F">F碼</button>
          <button class="tab-btn flex-1 py-1.5 text-center font-bold rounded-md transition text-gray-600 hover:text-gray-900" data-type="EI">EI碼</button>
        </div>
      </div>

      <div id="list-container" class="flex-1 overflow-y-auto custom-scrollbar divide-y divide-gray-100 bg-white">
        <div class="p-8 text-center text-gray-400 text-sm">請點擊右上方「同步資料」下載基準表</div>
      </div>
      
      <div class="p-2 bg-gray-50 border-t border-gray-100 text-[11px] text-gray-500 flex justify-between shrink-0">
        <span id="data-status">尚未下載資料</span>
        <span id="data-count">共 0 筆</span>
      </div>
    </section>

    <section id="detail-container" class="flex-1 bg-gray-50 p-4 md:p-6 overflow-y-auto custom-scrollbar">
      <div class="h-full flex flex-col justify-center items-center text-gray-400 space-y-2">
        <span class="text-4xl">🔍</span>
        <p class="text-sm md:text-base font-bold text-gray-500">請點擊右上方「同步資料」下載基準表</p>
      </div>
    </section>

  </main>

  <script>
    const SPREADSHEET_ID = '125LnQ0molmbeKgugV0u9scsmfRTj3XQ2Xnwzzj4doiY';
    const GIDS = { 'E': '0', 'F': '2026804754', 'EI': '1620936886' };

    let allData = [];       
    let currentTab = 'ALL'; 
    let activeId = null;    

    const syncBtn = document.getElementById('sync-btn');
    const searchInput = document.getElementById('search-input');
    const clearSearchBtn = document.getElementById('clear-search');
    const listContainer = document.getElementById('list-container');
    const detailContainer = document.getElementById('detail-container');
    const dataStatus = document.getElementById('data-status');
    const dataCount = document.getElementById('data-count');
    const tabButtons = document.querySelectorAll('.tab-btn');
    
    const menuToggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    const drawerOverlay = document.getElementById('drawer-overlay');

    // 手機版抽屜切換開關
    function toggleDrawer(isOpen) {
      if (isOpen) {
        sidebar.classList.add('open');
        drawerOverlay.classList.add('open');
      } else {
        sidebar.classList.remove('open');
        drawerOverlay.classList.remove('open');
      }
    }

    menuToggle.addEventListener('click', () => toggleDrawer(!sidebar.classList.contains('open')));
    drawerOverlay.addEventListener('click', () => toggleDrawer(false));

    window.addEventListener('DOMContentLoaded', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
      }
      const cachedData = localStorage.getItem('ltc_data');
      const cachedTime = localStorage.getItem('ltc_sync_time');
      if (cachedData) {
        allData = JSON.parse(cachedData);
        dataStatus.textContent = `更新於: ${cachedTime}`;
        
        // 預設直接載入快取內的第一筆項目
        if (allData.length > 0) {
          activeId = allData[0]['碼別'];
        }
        renderList();
        if (activeId) {
          showDetail(activeId);
        }
      }
    });

    syncBtn.addEventListener('click', async () => {
      syncBtn.disabled = true;
      syncBtn.classList.add('opacity-70', 'cursor-not-allowed');
      document.getElementById('sync-icon').classList.add('animate-spin');
      listContainer.innerHTML = '<div class="p-8 text-center text-blue-500 text-sm font-medium">資料同步中...</div>';

      try {
        const fetchedData = [];
        for (const [type, gid] of Object.entries(GIDS)) {
          const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${gid}`;
          const response = await fetch(url);
          if (!response.ok) throw new Error(`連線失敗 ${type}`);
          const csvText = await response.text();
          fetchedData.push(...parseCSV(csvText, type));
        }
        allData = fetchedData;
        const nowStr = new Date().toLocaleString('zh-TW', { hour12: false });
        localStorage.setItem('ltc_data', JSON.stringify(allData));
        localStorage.setItem('ltc_sync_time', nowStr);
        dataStatus.textContent = `更新於: ${nowStr}`;
        
        if (allData.length > 0) {
          activeId = allData[0]['碼別'];
        }
        renderList();
        if (activeId) {
          showDetail(activeId);
        }
        
        alert('同步成功！已鎖定離線資料。');
      } catch (error) {
        alert(`同步失敗: ${error.message}`);
        const cachedData = localStorage.getItem('ltc_data');
        if (cachedData) { 
          allData = JSON.parse(cachedData); 
          if (allData.length > 0) activeId = allData[0]['碼別'];
          renderList(); 
          if (activeId) showDetail(activeId);
        }
      } finally {
        syncBtn.disabled = false;
        syncBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        document.getElementById('sync-icon').classList.remove('animate-spin');
      }
    });

    function parseCSV(csvText, type) {
      const result = []; const lines = []; let row = [""]; let inQuotes = false;
      for (let i = 0; i < csvText.length; i++) {
        const c = csvText[i]; const next = csvText[i+1];
        if (c === '"') { if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; } else { inQuotes = !inQuotes; } }
        else if (c === ',' && !inQuotes) { row.push(''); }
        else if ((c === '\r' || c === '\n') && !inQuotes) { if (c === '\r' && next === '\n') { i++; } lines.push(row); row = ['']; }
        else { row[row.length - 1] += c; }
      }
      if (row.length > 1 || row[0] !== '') lines.push(row);
      if (lines.length <= 1) return [];
      const headers = lines[0].map(h => h.trim());
      for (let i = 1; i < lines.length; i++) {
        const currentLine = lines[i]; if (currentLine.length < 2 || !currentLine[0]) continue;
        const record = { type: type };
        headers.forEach((header, index) => { record[header] = currentLine[index] ? currentLine[index].trim() : ''; });
        result.push(record);
      }
      return result;
    }

    // 7. 渲染左側項目清單邏輯 (比照身障系統作法：產生乾淨、帶有 data-id 標記的 DOM 元素)
    function renderList() {
      const keyword = searchInput.value.toLowerCase().trim();
      const filtered = allData.filter(item => {
        const matchTab = (currentTab === 'ALL' || item.type === currentTab);
        const itemName = item['輔具及居家無障礙環境改善項目'] || item['照顧組合名稱'] || '';
        const itemId = item['碼別'] || '';
        return matchTab && (itemId.toLowerCase().includes(keyword) || itemName.toLowerCase().includes(keyword));
      });

      dataCount.textContent = `共 ${filtered.length} 筆`;
      if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">找不到符合條件的項目</div>';
        return;
      }

      // 生成清單，並在最外層加上 data-id 與 data-type，方便點擊時直接抽換 class
      listContainer.innerHTML = filtered.map(item => {
        const id = item['碼別'];
        const name = item['輔具及居家無障礙環境改善項目'] || item['照顧組合名稱'];
        const isActive = id === activeId;
        
        let activeBarClass = 'border-l-[5px] border-transparent'; 
        let boxClass = '';
        
        if (item.type === 'E') {
          if (isActive) activeBarClass = 'border-l-[5px] border-blue-600 bg-blue-50/60';
          boxClass = isActive ? 'border-2 border-blue-600 bg-blue-600 text-white' : 'border-2 border-blue-400 text-blue-600 bg-white';
        } else if (item.type === 'F') {
          if (isActive) activeBarClass = 'border-l-[5px] border-teal-600 bg-teal-50/60';
          boxClass = isActive ? 'border-2 border-teal-600 bg-teal-600 text-white' : 'border-2 border-teal-400 text-teal-600 bg-white';
        } else if (item.type === 'EI') {
          if (isActive) activeBarClass = 'border-l-[5px] border-amber-600 bg-amber-50/60';
          boxClass = isActive ? 'border-2 border-amber-600 bg-amber-600 text-white' : 'border-2 border-amber-400 text-amber-600 bg-white';
        }

        return `
          <div data-id="${id}" data-type="${item.type}" onclick="showDetail('${id}')" class="list-item-row p-3.5 cursor-pointer transition select-none flex items-center space-x-4 border-b border-gray-100 ${activeBarClass}">
            <div class="code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm transition-colors duration-150 ${boxClass}">
              ${id}
            </div>
            <div class="flex-1 min-w-0">
              <div class="item-name-text text-sm md:text-base font-bold ${isActive ? 'text-blue-700 font-black' : 'text-gray-800'} leading-snug break-words">${name}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 8. 展開顯示右側詳細資訊面板 (終極修正版：直接控制 DOM Class，不再出錯)
    window.showDetail = function(id) {
      activeId = id; // 更新當前選中變數
      toggleDrawer(false); // 手機版自動關閉抽屜

      // 💡 核心優化：比照身障系統，直接動態抽換畫面上所有清單項目的 Class 樣式
      const allRows = document.querySelectorAll('.list-item-row');
      allRows.forEach(row => {
        const rowId = row.getAttribute('data-id');
        const rowType = row.getAttribute('data-type');
        const box = row.querySelector('.code-box-icon');
        const text = row.querySelector('.item-name-text');
        
        if (rowId === activeId) {
          // 被選中的項目：加上專屬的立體粗邊條與填滿色
          row.className = `list-item-row p-3.5 cursor-pointer transition select-none flex items-center space-x-4 border-b border-gray-100`;
          if (rowType === 'E') {
            row.classList.add('border-l-[5px]', 'border-blue-600', 'bg-blue-50/60');
            box.className = 'code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm transition-colors duration-150 border-2 border-blue-600 bg-blue-600 text-white';
          } else if (rowType === 'F') {
            row.classList.add('border-l-[5px]', 'border-teal-600', 'bg-teal-50/60');
            box.className = 'code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm transition-colors duration-150 border-2 border-teal-600 bg-teal-600 text-white';
          } else if (rowType === 'EI') {
            row.classList.add('border-l-[5px]', 'border-amber-600', 'bg-amber-50/60');
            box.className = 'code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm transition-colors duration-150 border-2 border-amber-600 bg-amber-600 text-white';
          }
          if (text) { text.className = 'item-name-text text-sm md:text-base font-black text-blue-700 leading-snug break-words'; }
        } else {
          // 沒被選中的項目：恢復原本的外框樣式，移除粗邊條
          row.className = `list-item-row p-3.5 cursor-pointer transition select-none flex items-center space-x-4 border-b border-gray-100 border-l-[5px] border-transparent hover:bg-gray-50 bg-white`;
          if (rowType === 'E') {
            box.className = 'code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm transition-colors duration-150 border-2 border-blue-400 text-blue-600 bg-white';
          } else if (rowType === 'F') {
            box.className = 'code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm transition-colors duration-150 border-2 border-teal-400 text-teal-600 bg-white';
          } else if (rowType === 'EI') {
            box.className = 'code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm transition-colors duration-150 border-2 border-amber-400 text-amber-600 bg-white';
          }
          if (text) { text.className = 'item-name-text text-sm md:text-base font-bold text-gray-800 leading-snug break-words'; }
        }
      });

      // 渲染右側詳細資料大卡片
      const item = allData.find(d => d['碼別'] === id);
      if (!item) return;

      let htmlContent = `
        <div class="bg-white rounded-xl shadow-md border border-gray-200 p-5 md:p-8 space-y-5 w-full">
          <div class="border-b-2 border-gray-100 pb-4">
            <div class="text-lg font-mono font-black text-blue-600 tracking-wider mb-0.5">${item['碼別']}</div>
            <h2 class="text-2xl md:text-3xl font-black text-gray-900 leading-tight">${item['輔具及居家無障礙環境改善項目'] || item['照顧組合名稱']}</h2>
          </div>
      `;

      if (item.type === 'E' || item.type === 'F') {
        htmlContent += `<div class="grid grid-cols-2 md:grid-cols-4 gap-3.5">`;
        htmlContent += renderDetailRow('給付方式', item['給付方式'], false, 'gray');
        htmlContent += renderDetailRow('法定年限', item['年限'], false, 'blue');
        
        const buyVal = item['購買給付上限'] ? (item['購買給付上限'].includes('$') || item['購買給付上限'].includes('不適用') ? item['購買給付上限'] : `$${item['購買給付上限']}`) : '無';
        const rentVal = item['租賃給付上限'] ? (item['租賃給付上限'].includes('$') || item['租賃給付上限'].includes('不適用') ? item['租賃給付上限'] : `$${item['租賃給付上限']}`) : '無';
        
        htmlContent += renderDetailRow('購買給付上限', buyVal, false, 'green');
        htmlContent += renderDetailRow('租賃給付上限', rentVal, false, 'purple');
        htmlContent += `</div><div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">`;
        
        if (item.type === 'E') {
          htmlContent += renderDetailRow('是否需評估', item['是否需評估'], true, 'amber');
          htmlContent += renderDetailRow('部分負擔比例', item['部份負擔'], true, 'indigo');
        } else {
          htmlContent += renderDetailRow('修繕標的', item['修繕標的'], true, 'amber');
        }
        htmlContent += `</div><div class="space-y-4.5 pt-4 border-t border-gray-100">`; 
        htmlContent += renderDetailBlock('項目內容說明', item['內容'], 'blue');
        htmlContent += renderDetailBlock('規格/功能規範', item['規格/功能規範'], 'emerald');
        htmlContent += renderDetailBlock('補助及其他相關規定', item['補助規定'] || item['其他規定'], 'rose');
        if (item.type === 'E') htmlContent += renderDetailBlock('租賃相關規定', item['租賃規定'], 'purple');
        
        // 顯示 F 碼的「通則」
        if (item.type === 'F' && item['通則']) {
          htmlContent += renderDetailBlock('💡 F碼 相關通則規範', item['通則'], 'gray');
        }
      } else if (item.type === 'EI') {
        htmlContent += `<div class="grid grid-cols-1 gap-3.5">`;
        htmlContent += renderDetailRow('適用對象說明', item['適用對隊'] || item['適用對象'], true, 'blue');
        htmlContent += renderDetailRow('租賃價格參考', item['租賃價格'] || '未載明', true, 'amber');
        htmlContent += `</div><div class="space-y-4.5 pt-4 border-t border-gray-100">`;
        htmlContent += renderDetailBlock('規格/功能規範細節', item['規格/功能規範'], 'emerald');
        
        // 顯示 EI 碼的「通則']
        if (item['通則']) {
          htmlContent += renderDetailBlock('💡 EI碼 相關通則規範', item['通則'], 'gray');
        }
      }

      htmlContent += `</div></div>`;
      detailContainer.innerHTML = htmlContent;
    };

    function renderDetailRow(label, value, isFullWidth = false, colorStyle = 'gray') {
      if (!value || value === '-' || value === '無' || value.trim() === '') return '';
      let colors = { bg: 'bg-gray-200 text-gray-800', box: 'bg-gray-50 border-gray-200' };
      if (colorStyle === 'blue') colors = { bg: 'bg-blue-600 text-white', box: 'bg-blue-50/40 border-blue-100' };
      if (colorStyle === 'green') colors = { bg: 'bg-emerald-600 text-white', box: 'bg-emerald-50/40 border-emerald-100' };
      if (colorStyle === 'purple') colors = { bg: 'bg-purple-600 text-white', box: 'bg-purple-50/40 border-purple-100' };
      if (colorStyle === 'amber') colors = { bg: 'bg-amber-500 text-white', box: 'bg-amber-50/40 border-amber-100' };
      if (colorStyle === 'indigo') colors = { bg: 'bg-indigo-600 text-white', box: 'bg-indigo-50/40 border-indigo-100' };

      return `
        <div class="p-3 md:p-4 rounded-xl border shadow-sm ${colors.box} ${isFullWidth ? 'md:col-span-2' : ''}">
          <div class="text-[11px] md:text-xs font-black tracking-wider px-2 py-0.5 rounded shadow-sm inline-block mb-1.5 ${colors.bg}">${label}</div>
          <div class="text-base md:text-lg font-black text-gray-900 leading-relaxed whitespace-pre-line">${value}</div>
        </div>
      `;
    }

    function renderDetailBlock(label, value, theme = 'blue') {
      if (!value || value === '無' || value === '-' || value.trim() === '') return '';
      let colors = { bg: 'bg-blue-200/80 text-blue-900', border: 'border-blue-200/60 bg-blue-50/40' };
      if (theme === 'emerald') colors = { bg: 'bg-emerald-200/80 text-emerald-900', border: 'border-emerald-200/60 bg-emerald-50/30' };
      if (theme === 'rose') colors = { bg: 'bg-rose-200/80 text-rose-900', border: 'border-rose-200/60 bg-rose-50/30' };
      if (theme === 'purple') colors = { bg: 'bg-purple-200/80 text-purple-900', border: 'border-purple-200/60 bg-purple-50/30' };
      if (theme === 'gray') colors = { bg: 'bg-gray-300 text-gray-900', border: 'border-gray-300 bg-gray-100/70' };

      return `
        <div class="p-4 md:p-5 rounded-xl border shadow-sm ${colors.border}">
          <h3 class="text-xs md:text-sm font-black px-2.5 py-1 rounded inline-block mb-2 shadow-sm ${colors.bg}">${label}</h3>
          <p class="text-sm md:text-base text-gray-800 font-bold leading-relaxed whitespace-pre-line pl-1">${value}</p>
        </div>
      `;
    }

    searchInput.addEventListener('input', () => {
      clearSearchBtn.classList.toggle('hidden', searchInput.value.length === 0);
      renderList();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = ''; clearSearchBtn.classList.add('hidden'); renderList(); searchInput.focus();
    });

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        tabButtons.forEach(btn => { btn.classList.remove('bg-white', 'text-blue-600', 'shadow-sm'); btn.classList.add('text-gray-600', 'hover:text-gray-900'); });
        button.classList.remove('text-gray-600', 'hover:text-gray-900'); button.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
        currentTab = button.getAttribute('data-type');
        renderList();
        
        // 💡 貼心功能：切換分頁標籤時，自動點選該分類底下的第一筆項目，確保邊條與右側同步更新
        const firstRow = listContainer.querySelector('.list-item-row');
        if (firstRow) {
          const firstId = firstRow.getAttribute('data-id');
          showDetail(firstId);
        }
      });
    });
  </script>
</body>
</html>
