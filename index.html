<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>長照補助基準查詢系統</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .list-item-row {
      border-left: 5px solid transparent;
      transition: all 0.15s ease-in-out;
    }
    .list-item-row.active-E {
      border-left: 5px solid #2563eb !important;
      background-color: #f0f6ff !important;
    }
    .list-item-row.active-F {
      border-left: 5px solid #0d9488 !important;
      background-color: #f0fdfa !important;
    }
    .list-item-row.active-EI {
      border-left: 5px solid #d97706 !important;
      background-color: #fef3c7 !important;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    
    @media (max-width: 767px) {
      .sidebar-drawer {
        position: fixed;
        top: 56px; left: 0; bottom: 0; z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.3s ease-in-out;
        width: 85% !important; max-width: 340px;
      }
      .sidebar-drawer.open { transform: translateX(0); }
      .drawer-overlay {
        position: fixed;
        top: 56px; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.4); z-index: 40;
        opacity: 0; pointer-events: none; transition: opacity 0.3s ease-in-out;
      }
      .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    }
  </style>
</head>
<body class="bg-gray-50 font-sans h-screen flex flex-col overflow-hidden select-none text-gray-900">

  <header class="bg-blue-600 text-white h-[56px] px-4 shadow-md flex justify-between items-center shrink-0 z-50">
    <div class="flex items-center space-x-2 min-w-0">
      <h1 class="text-base md:text-lg font-bold tracking-wider truncate">長照補助查詢系統</h1>
      <span class="bg-blue-800 text-[10px] md:text-xs px-2 py-0.5 rounded-full font-medium shrink-0">2026年7月新制</span>
    </div>
    
    <div class="flex items-center space-x-2 shrink-0">
      <button id="sync-btn" class="bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white text-xs md:text-sm font-medium px-2.5 py-1.5 md:px-3 rounded shadow flex items-center transition">
        <span id="sync-icon" class="mr-1">🔄</span> 同步資料
      </button>
      <button id="menu-toggle" class="md:hidden p-1.5 hover:bg-blue-700 rounded-lg transition" aria-label="開啟選單">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
  </header>

  <div id="drawer-overlay" class="drawer-overlay"></div>

  <main class="flex-1 flex overflow-hidden relative">
    
    <section id="sidebar" class="sidebar-drawer w-1/3 min-w-[300px] max-w-[400px] border-r border-gray-200 bg-white flex flex-col h-full shrink-0 shadow-lg md:shadow-none">
      <div class="p-3 border-b border-gray-100 space-y-2.5 bg-gray-50/50">
        <div class="relative">
          <input type="text" id="search-input" placeholder="輸入碼別或項目關鍵字..." 
                 class="w-full pl-3 pr-8 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-base">
          <button id="clear-search" class="absolute right-2.5 top-2.5 text-gray-400 hover:text-gray-600 hidden text-sm">✕</button>
        </div>
        
        <div class="flex p-0.5 bg-gray-200 rounded-lg text-xs md:text-sm">
          <button class="tab-btn flex-1 py-1.5 text-center font-bold rounded-md transition bg-white text-blue-600 shadow-sm" data-type="ALL">全部</button>
          <button class="tab-btn flex-1 py-1.5 text-center font-bold rounded-md transition text-gray-600 hover:text-gray-900" data-type="E">E碼</button>
          <button class="tab-btn flex-1 py-1.5 text-center font-bold rounded-md transition text-gray-600 hover:text-gray-900" data-type="F">F碼</button>
          <button class="tab-btn flex-1 py-1.5 text-center font-bold rounded-md transition text-gray-600 hover:text-gray-900" data-type="EI">EI碼</button>
        </div>
      </div>

      <div id="list-container" class="flex-1 overflow-y-auto custom-scrollbar bg-white">
        <div class="p-8 text-center text-gray-400 text-sm">請點擊右上方「同步資料」下載基準表</div>
      </div>
      
      <div class="p-2 bg-gray-50 border-t border-gray-100 text-[11px] text-gray-500 flex justify-between shrink-0">
        <span id="data-status">尚未下載資料</span>
        <span id="data-count">共 0 筆</span>
      </div>
    </section>

    <section id="detail-container" class="flex-1 bg-gray-50 p-4 md:p-8 overflow-y-auto custom-scrollbar">
      <div class="h-full flex flex-col justify-center items-center text-gray-400 space-y-2">
        <span class="text-4xl">🔍</span>
        <p class="text-sm md:text-base font-bold text-gray-500">請由左側或點選右上角選單鈕 ☰ 選擇項目</p>
      </div>
    </section>

  </main>

  <script>
    const SPREADSHEET_ID = '125LnQ0molmbeKgugV0u9scsmfRTj3XQ2Xnwzzj4doiY';
    const GIDS = { 'E': '0', 'F': '2026804754', 'EI': '1620936886' };

    let allData = [];       
    let currentTab = 'ALL'; 
    let activeId = null;    

    const syncBtn = document.getElementById('sync-btn');
    const searchInput = document.getElementById('search-input');
    const clearSearchBtn = document.getElementById('clear-search');
    const listContainer = document.getElementById('list-container');
    const detailContainer = document.getElementById('detail-container');
    const dataStatus = document.getElementById('data-status');
    const dataCount = document.getElementById('data-count');
    const tabButtons = document.querySelectorAll('.tab-btn');
    
    const menuToggle = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar');
    const drawerOverlay = document.getElementById('drawer-overlay');

    function toggleDrawer(isOpen) {
      if (isOpen) {
        sidebar.classList.add('open');
        drawerOverlay.classList.add('open');
      } else {
        sidebar.classList.remove('open');
        drawerOverlay.classList.remove('open');
      }
    }

    menuToggle.addEventListener('click', () => toggleDrawer(!sidebar.classList.contains('open')));
    drawerOverlay.addEventListener('click', () => toggleDrawer(false));

    window.addEventListener('DOMContentLoaded', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
      }
      const cachedData = localStorage.getItem('ltc_data');
      const cachedTime = localStorage.getItem('ltc_sync_time');
      if (cachedData) {
        allData = JSON.parse(cachedData);
        dataStatus.textContent = `更新於: ${cachedTime}`;
        if (allData.length > 0) activeId = allData[0]['碼別'];
        renderList();
        if (activeId) showDetailFromTab(activeId);
      }
    });

    syncBtn.addEventListener('click', async () => {
      syncBtn.disabled = true;
      syncBtn.classList.add('opacity-70', 'cursor-not-allowed');
      document.getElementById('sync-icon').classList.add('animate-spin');
      listContainer.innerHTML = '<div class="p-8 text-center text-blue-500 text-sm font-medium">資料同步中...</div>';

      try {
        const fetchedData = [];
        for (const [type, gid] of Object.entries(GIDS)) {
          const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${gid}`;
          const response = await fetch(url);
          if (!response.ok) throw new Error(`連線失敗 ${type}`);
          const csvText = await response.text();
          fetchedData.push(...parseCSV(csvText, type));
        }
        allData = fetchedData;
        const nowStr = new Date().toLocaleString('zh-TW', { hour12: false });
        localStorage.setItem('ltc_data', JSON.stringify(allData));
        localStorage.setItem('ltc_sync_time', nowStr);
        dataStatus.textContent = `更新於: ${nowStr}`;
        if (allData.length > 0) activeId = allData[0]['碼別'];
        renderList();
        if (activeId) showDetailFromTab(activeId);
        alert('同步成功！已鎖定離線資料。');
      } catch (error) {
        alert(`同步失敗: ${error.message}`);
        const cachedData = localStorage.getItem('ltc_data');
        if (cachedData) { 
          allData = JSON.parse(cachedData); 
          if (allData.length > 0) activeId = allData[0]['碼別'];
          renderList(); 
          if (activeId) showDetailFromTab(activeId);
        }
      } finally {
        syncBtn.disabled = false;
        syncBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        document.getElementById('sync-icon').classList.remove('animate-spin');
      }
    });

    function parseCSV(csvText, type) {
      const result = []; const lines = []; let row = [""]; let inQuotes = false;
      for (let i = 0; i < csvText.length; i++) {
        const c = csvText[i]; const next = csvText[i+1];
        if (c === '"') { if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; } else { inQuotes = !inQuotes; } }
        else if (c === ',' && !inQuotes) { row.push(''); }
        else if ((c === '\r' || c === '\n') && !inQuotes) { if (c === '\r' && next === '\n') { i++; } lines.push(row); row = ['']; }
        else { row[row.length - 1] += c; }
      }
      if (row.length > 1 || row[0] !== '') lines.push(row);
      if (lines.length <= 1) return [];
      
      const headers = lines[0].map(h => h.replace(/[\r\n]/g, '').trim());
      
      for (let i = 1; i < lines.length; i++) {
        const currentLine = lines[i]; if (currentLine.length < 2 || !currentLine[0]) continue;
        const record = { type: type };
        headers.forEach((header, index) => { record[header] = currentLine[index] ? currentLine[index].trim() : ''; });
        result.push(record);
      }
      return result;
    }

    function renderList() {
      const keyword = searchInput.value.toLowerCase().trim();
      const filtered = allData.filter(item => {
        const matchTab = (currentTab === 'ALL' || item.type === currentTab);
        const itemName = item['輔具及居家無障礙環境改善項目'] || item['照顧組合名稱'] || '';
        const itemId = item['碼別'] || '';
        return matchTab && (itemId.toLowerCase().includes(keyword) || itemName.toLowerCase().includes(keyword));
      });

      dataCount.textContent = `共 ${filtered.length} 筆`;
      if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">找不到符合條件的項目</div>';
        return;
      }

      listContainer.innerHTML = filtered.map(item => {
        const id = item['碼別'];
        const name = item['輔具及居家無障礙環境改善項目'] || item['照顧組合名稱'];
        const isActive = id === activeId;
        
        let activeClass = isActive ? `active-${item.type}` : '';
        let boxClass = '';
        if (item.type === 'E') boxClass = isActive ? 'border-2 border-blue-600 bg-blue-600 text-white' : 'border-2 border-blue-400 text-blue-600 bg-white';
        else if (item.type === 'F') boxClass = isActive ? 'border-2 border-teal-600 bg-teal-600 text-white' : 'border-2 border-teal-400 text-teal-600 bg-white';
        else if (item.type === 'EI') boxClass = isActive ? 'border-2 border-amber-600 bg-amber-600 text-white' : 'border-2 border-amber-400 text-amber-600 bg-white';

        return `
          <div data-id="${id}" data-type="${item.type}" onclick="showDetail('${id}')" 
               class="list-item-row p-4 cursor-pointer flex items-center space-x-4 border-b border-gray-200 hover:bg-gray-50/80 bg-white ${activeClass}">
            <div class="code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm transition-colors duration-150 ${boxClass}">
              ${id}
            </div>
            <div class="flex-1 min-w-0">
              <div class="item-name-text text-sm md:text-base font-bold ${isActive ? 'text-blue-700 font-black' : 'text-gray-800'} leading-snug break-words">${name}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateListItemStyles(id) {
      const allRows = document.querySelectorAll('.list-item-row');
      allRows.forEach(row => {
        const rowId = row.getAttribute('data-id');
        const rowType = row.getAttribute('data-type');
        const box = row.querySelector('.code-box-icon');
        const text = row.querySelector('.item-name-text');
        
        row.classList.remove('active-E', 'active-F', 'active-EI');
        
        if (rowId === id) {
          row.classList.add(`active-${rowType}`);
          if (rowType === 'E') box.className = 'code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm border-2 border-blue-600 bg-blue-600 text-white';
          else if (rowType === 'F') box.className = 'code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm border-2 border-teal-600 bg-teal-700 text-white';
          else if (rowType === 'EI') box.className = 'code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm border-2 border-amber-600 bg-amber-600 text-white';
          if (text) text.className = 'item-name-text text-sm md:text-base font-black text-blue-700 leading-snug break-words';
        } else {
          if (rowType === 'E') box.className = 'code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm border-2 border-blue-400 text-blue-600 bg-white';
          else if (rowType === 'F') box.className = 'code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm border-2 border-teal-400 text-teal-600 bg-white';
          else if (rowType === 'EI') box.className = 'code-box-icon w-12 h-12 flex justify-center items-center rounded-xl font-mono font-black text-xs shrink-0 shadow-sm border-2 border-amber-400 text-amber-600 bg-white';
          if (text) text.className = 'item-name-text text-sm md:text-base font-bold text-gray-800 leading-snug break-words';
        }
      });
    }

    function generateDetailHTML(item) {
      let htmlContent = `
        <div class="bg-white rounded-xl shadow-md border border-gray-200 p-5 md:p-8 space-y-6 w-full">
          <div class="border-b-2 border-gray-100 pb-5">
            <div class="flex flex-wrap items-baseline gap-x-4">
              <span class="text-2xl md:text-3xl font-mono font-black text-blue-600 tracking-wider shrink-0">${item['碼別']}</span>
              <h2 class="text-2xl md:text-3xl font-black text-gray-900 leading-tight">${item['輔具及居家無障礙環境改善項目'] || item['照顧組合名稱']}</h2>
            </div>
          </div>
          
          <div class="space-y-4">
      `;

      const fmtMoney = (val) => {
        if (!val || val === '-' || val === '無' || val.includes('不適用')) return '不適用';
        return val.replace('$', '').trim();
      };

      if (item.type === 'E' || item.type === 'F') {
        htmlContent += `<div class="grid grid-cols-2 gap-3.5">`;
        htmlContent += renderDetailItem('給付方式', item['給付方式'], 'bg-gray-100 text-gray-700 border-gray-300');
        htmlContent += renderDetailItem('法定年限', item['年限'], 'bg-blue-50 text-blue-700 border-blue-200');
        htmlContent += `</div>`;

        htmlContent += `
          <div class="flex w-full items-stretch space-x-3 sm:space-x-4 bg-gray-50/50 p-2 rounded-2xl border border-gray-100 shadow-sm">
            <div class="flex-[3] grid grid-cols-3 gap-2 sm:gap-3">
              ${renderCardItem('第一類', fmtMoney(item['購置給付(第一類)']), 'bg-blue-50/60 border-blue-200/80', 'text-blue-700')}
              ${renderCardItem('第二類', fmtMoney(item['購置給付(第二類)']), 'bg-teal-50/60 border-teal-200/80', 'text-teal-700')}
              ${renderCardItem('第三類', fmtMoney(item['購置給付(第三類)']), 'bg-amber-50/60 border-amber-200/80', 'text-amber-700')}
            </div>
            
            <div class="flex items-center justify-center shrink-0 px-1 sm:px-2">
              <div class="h-10 w-[2px] bg-gray-300 rounded-full"></div>
            </div>
            
            <div class="flex-[1]">
              ${renderCardItem('租賃', fmtMoney(item['租賃給付上限']), 'bg-purple-50/60 border-purple-200/80', 'text-purple-700')}
            </div>
          </div>
        `;

        htmlContent += `<div class="w-full">`;
        if (item.type === 'E') {
          htmlContent += renderDetailItem('是否需要評估', item['是否需評估'] || item['是否需要評估'], 'bg-amber-50 text-amber-700 border-amber-200');
        } else {
          htmlContent += renderDetailItem('修繕標的', item['修繕標的'], 'bg-amber-50 text-amber-700 border-amber-200');
        }
        htmlContent += `</div>`;

        if (item.type === 'E' && item['部份負擔'] && item['部份負擔'] !== '-') {
          htmlContent += `<div class="w-full">`;
          htmlContent += renderDetailItem('部份負擔', item['部份負擔'], 'bg-indigo-50 text-indigo-700 border-indigo-200');
          htmlContent += `</div>`;
        }
        
        htmlContent += `</div>`; 

        htmlContent += `<div class="space-y-6 pt-5 border-t border-gray-100">`; 
        htmlContent += renderDetailBlock('項目內容說明', item['內容'], 'blue');
        
        if (item.type === 'E') {
          htmlContent += renderDetailBlock('規格/功能規範', item['規格/功能規範'], 'emerald');
          htmlContent += renderDetailBlock('補助規定', item['補助規定'], 'rose');
          htmlContent += renderDetailBlock('租賃相關規定', item['租賃規定'], 'purple');
          htmlContent += renderDetailBlock('其他規定說明', item['其他規定'], 'gray');
        } else {
          htmlContent += renderDetailBlock('規格/功能規範與補助規定', item['規格/功能規範補助規定'], 'emerald');
          if (item['通則']) htmlContent += renderDetailBlock('💡 F碼 相關通則規範', item['通則'], 'gray');
        }
      } else if (item.type === 'EI') {
        htmlContent += `<div class="grid grid-cols-2 gap-3.5">`;
        htmlContent += renderDetailItem('給付方式', item['給付方式'] || '租賃', 'bg-gray-100 text-gray-700 border-gray-300');
        htmlContent += `<div></div></div></div>`;
        htmlContent += `<div class="space-y-6 pt-5 border-t border-gray-100">`;
        htmlContent += renderDetailBlock('適用對象說明', item['適用對象'], 'blue');
        htmlContent += renderDetailBlock('租賃價格參考說明', item['租賃價格'], 'amber');
        htmlContent += renderDetailBlock('規格/功能規範細節', item['規格/功能規範'], 'emerald');
        if (item['通則']) htmlContent += renderDetailBlock('💡 EI碼 相關通則規範', item['通則'], 'gray');
      }

      htmlContent += `</div></div>`;
      return htmlContent;
    }

    // 💡 修正 1：標準方塊的標籤字體拉大至 text-xs md:text-sm，並增加內距 px-2.5 py-1 讓其更飽滿
    function renderDetailItem(label, value, styleClasses) {
      if (!value || value === '-' || value === '無' || value.trim() === '') return '<div></div>';
      return `
        <div class="p-4 rounded-xl border border-gray-200 shadow-sm bg-white flex flex-col justify-between w-full h-full">
          <div class="text-xs md:text-sm font-black tracking-wider px-2.5 py-1 rounded shadow-sm inline-block mb-2 self-start ${styleClasses}">${label}</div>
          <div class="text-sm md:text-base font-black text-gray-900 leading-relaxed whitespace-pre-line break-words">${value}</div>
        </div>
      `;
    }

    // 💡 修正 2：卡片方塊的標籤字體拉大至 text-xs md:text-sm
    function renderCardItem(label, value, cardColorClass, textLabelColorClass) {
      return `
        <div class="p-2.5 rounded-xl border shadow-sm flex flex-col justify-between items-center text-center w-full h-full min-h-[82px] ${cardColorClass}">
          <div class="text-xs md:text-sm font-black tracking-wider uppercase block mb-1.5 ${textLabelColorClass}">${label}</div>
          <div class="text-base sm:text-lg font-black text-gray-900 leading-none break-words">${value}</div>
        </div>
      `;
    }

    function renderDetailBlock(label, value, theme = 'blue') {
      if (!value || value === '無' || value === '-' || value.trim() === '') return '';
      let colors = { bg: 'bg-blue-200/80 text-blue-900', border: 'border-blue-200/60 bg-blue-50/40' };
      if (theme === 'emerald') colors = { bg: 'bg-emerald-200/80 text-emerald-900', border: 'border-emerald-200/60 bg-emerald-50/30' };
      if (theme === 'rose') colors = { bg: 'bg-rose-200/80 text-rose-900', border: 'border-rose-200/60 bg-rose-50/30' };
      if (theme === 'purple') colors = { bg: 'bg-purple-200/80 text-purple-900', border: 'border-purple-200/60 bg-purple-50/30' };
      if (theme === 'gray') colors = { bg: 'bg-gray-300 text-gray-900', border: 'border-gray-300 bg-gray-100/70' };

      return `
        <div class="p-5 rounded-xl border shadow-sm ${colors.border}">
          <h3 class="text-xs md:text-sm font-black px-2.5 py-1 rounded inline-block mb-2 shadow-sm ${colors.bg}">${label}</h3>
          <p class="text-sm md:text-base text-gray-800 font-bold leading-relaxed whitespace-pre-line pl-1">${value}</p>
        </div>
      `;
    }

    window.showDetail = function(id) {
      activeId = id;
      toggleDrawer(false); 
      updateListItemStyles(id);
      const item = allData.find(d => d['碼別'] === id);
      if (!item) return;
      detailContainer.innerHTML = generateDetailHTML(item);
    };

    function showDetailFromTab(id) {
      activeId = id;
      updateListItemStyles(id);
      const item = allData.find(d => d['碼別'] === id);
      if (!item) return;
      detailContainer.innerHTML = generateDetailHTML(item);
    }

    searchInput.addEventListener('input', () => {
      clearSearchBtn.classList.toggle('hidden', searchInput.value.length === 0);
      renderList();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = ''; clearSearchBtn.classList.add('hidden'); renderList(); searchInput.focus();
    });

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        tabButtons.forEach(btn => { 
          btn.classList.remove('bg-white', 'text-blue-600', 'shadow-sm'); 
          btn.classList.add('text-gray-600', 'hover:text-gray-900'); 
        });
        button.classList.remove('text-gray-600', 'hover:text-gray-900'); 
        button.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
        currentTab = button.getAttribute('data-type');
        renderList();
        const firstRow = listContainer.querySelector('.list-item-row');
        if (firstRow) showDetailFromTab(firstRow.getAttribute('data-id'));
      });
    });
  </script>
</body>
</html>
